name: Build Android APK

on:
  workflow_dispatch: # این خط به شما اجازه می‌دهد بیلد را دستی اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      # تغییر اول: بیلد گرفتن در حالت Release به جای Debug
      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      # تغییر دوم: اضافه شدن مرحله امضای دیجیتال
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0
      # تغییر سوم: آپلود کردن فایل امضاشده نهایی
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hadi-factor-apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
